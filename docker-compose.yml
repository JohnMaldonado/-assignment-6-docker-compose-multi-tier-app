version: '3.8'

# Custom networks for service isolation
networks:
  jhon-frontend-network:
    driver: bridge
    name: jhon-frontend-network
  jhon-backend-network:
    driver: bridge
    name: jhon-backend-network

# Named volumes for data persistence
volumes:
  jhon-postgres-data:
    name: jhon-postgres-data
  jhon-redis-data:
    name: jhon-redis-data

services:
  # PostgreSQL Database
  jhon-postgres:
    image: postgres:15-alpine
    container_name: jhon-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-jhon_db}
      POSTGRES_USER: ${DB_USER:-jhon_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jhon_password}
      POSTGRES_INITDB_ARGS: "-E UTF8"
    volumes:
      - jhon-postgres-data:/var/lib/postgresql/data
    networks:
      - jhon-backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-jhon_user} -d ${DB_NAME:-jhon_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Redis Cache
  jhon-redis:
    image: redis:7-alpine
    container_name: jhon-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-jhon_redis_pass}
    volumes:
      - jhon-redis-data:/data
    networks:
      - jhon-backend-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Backend API (Flask)
  jhon-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: jhon-backend:latest
    container_name: jhon-backend
    restart: unless-stopped
    depends_on:
      jhon-postgres:
        condition: service_healthy
      jhon-redis:
        condition: service_healthy
    environment:
      FLASK_ENV: ${FLASK_ENV:-production}
      DB_HOST: jhon-postgres
      DB_NAME: ${DB_NAME:-jhon_db}
      DB_USER: ${DB_USER:-jhon_user}
      DB_PASSWORD: ${DB_PASSWORD:-jhon_password}
      REDIS_HOST: jhon-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-jhon_redis_pass}
    networks:
      - jhon-frontend-network
      - jhon-backend-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import requests; requests.get('http://localhost:5000/health')\" || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

  # Frontend (React)
  jhon-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: jhon-frontend:latest
    container_name: jhon-frontend
    restart: unless-stopped
    depends_on:
      - jhon-backend
    environment:
      REACT_APP_API_URL: http://localhost/api
    networks:
      - jhon-frontend-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:3000/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Nginx Reverse Proxy
  jhon-nginx:
    build:
      context: ./nginx
      dockerfile: Dockerfile
    image: jhon-nginx:latest
    container_name: jhon-nginx
    restart: unless-stopped
    depends_on:
      jhon-frontend:
        condition: service_healthy
      jhon-backend:
        condition: service_healthy
    ports:
      - "${NGINX_PORT:-80}:80"
    networks:
      - jhon-frontend-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"


